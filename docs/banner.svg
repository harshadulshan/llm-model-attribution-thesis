<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Which Model Leaves the Last Fingerprint?</title>
<desc id="d">Animated banner: a fingerprint that fades from left to right, next to the thesis title and the four models studied.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
</defs>
<style>
