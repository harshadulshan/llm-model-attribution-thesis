.mute{fill:#94a3b8}
.dim{fill:#64748b}

.scan{animation:scan 4.5s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(-150px)}50%{transform:translateY(150px)}100%{transform:translateY(-150px)}}
.r1{animation:flow 9s linear infinite} .r2{animation:flow 12s linear infinite reverse}
