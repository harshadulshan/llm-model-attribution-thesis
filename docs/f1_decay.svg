<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Attribution accuracy under rewriting pressure</title>
<desc id="d">Animated bar chart of mean macro F1: 0.706 on original text, 0.530 after light rewriting and 0.402 after heavy rewriting, against a chance level of 0.25.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mute{fill:#94a3b8}
.dim{fill:#64748b}

.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes grow{0%{transform:scaleY(0)}14%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.lab{animation:labin 10s ease-out infinite}
@keyframes labin{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="960" height="470" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="959" height="469" rx="22" fill="none" stroke="#2b3a5c" stroke-opacity=".8"/>
<text x="40" y="50" font-size="24" font-weight="700">Rewriting weakens the signal, but does not erase it</text><text x="40" y="78" font-size="15" class="mute">Mean macro F1 · 5-fold stratified CV · 761 passages · 4 classes · error bars = ±1 SD across folds</text><line x1="90" y1="385.0" x2="930" y2="385.0" stroke="#243049" stroke-width="1"/><text x="78" y="390.0" text-anchor="end" font-size="13" class="m dim">0.0</text><line x1="90" y1="321.2" x2="930" y2="321.2" stroke="#243049" stroke-width="1"/><text x="78" y="326.2" text-anchor="end" font-size="13" class="m dim">0.2</text><line x1="90" y1="257.5" x2="930" y2="257.5" stroke="#243049" stroke-width="1"/><text x="78" y="262.5" text-anchor="end" font-size="13" class="m dim">0.4</text><line x1="90" y1="193.8" x2="930" y2="193.8" stroke="#243049" stroke-width="1"/><text x="78" y="198.8" text-anchor="end" font-size="13" class="m dim">0.6</text><line x1="90" y1="130.0" x2="930" y2="130.0" stroke="#243049" stroke-width="1"/><text x="78" y="135.0" text-anchor="end" font-size="13" class="m dim">0.8</text><line x1="90" y1="305.3" x2="930" y2="305.3" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/><text x="930" y="281.3" text-anchor="end" font-size="13.5" class="m mute">chance = 0.25</text><text x="930" y="297.3" text-anchor="end" font-size="12" class="m dim">(4 classes)</text><rect class="bar" x="148.0" y="159.9" width="134" height="225.1" rx="10" fill="#2dd4bf" fill-opacity=".92"/><g class="lab" stroke="#0b1220" stroke-width="2.5"><line x1="215" y1="167.4" x2="215" y2="152.5"/><line x1="206" y1="167.4" x2="224" y2="167.4"/><line x1="206" y1="152.5" x2="224" y2="152.5"/></g><g class="lab"><text x="215" y="126.5" text-anchor="middle" font-size="30" font-weight="800" class="m">0.706</text><text x="215" y="144.5" text-anchor="middle" font-size="13" class="m mute">±0.023 · 2.8× chance</text></g><text x="215" y="415" text-anchor="middle" font-size="16" font-weight="600">Original text</text><rect class="bar" x="388.0" y="216.0" width="134" height="169.0" rx="10" fill="#fbbf24" fill-opacity=".92"/><g class="lab" stroke="#0b1220" stroke-width="2.5"><line x1="455" y1="223.8" x2="455" y2="208.2"/><line x1="446" y1="223.8" x2="464" y2="223.8"/><line x1="446" y1="208.2" x2="464" y2="208.2"/></g><g class="lab"><text x="455" y="182.2" text-anchor="middle" font-size="30" font-weight="800" class="m">0.530</text><text x="455" y="200.2" text-anchor="middle" font-size="13" class="m mute">±0.025 · 2.1× chance</text></g><text x="455" y="415" text-anchor="middle" font-size="16" font-weight="600">Light rewrite (≈ 40% edit)</text><rect class="bar" x="628.0" y="256.9" width="134" height="128.1" rx="10" fill="#fb7185" fill-opacity=".92"/><g class="lab" stroke="#0b1220" stroke-width="2.5"><line x1="695" y1="264.3" x2="695" y2="249.6"/><line x1="686" y1="264.3" x2="704" y2="264.3"/><line x1="686" y1="249.6" x2="704" y2="249.6"/></g><g class="lab"><text x="695" y="223.6" text-anchor="middle" font-size="30" font-weight="800" class="m">0.402</text><text x="695" y="241.6" text-anchor="middle" font-size="13" class="m mute">±0.023 · 1.6× chance</text></g><text x="695" y="415" text-anchor="middle" font-size="16" font-weight="600">Heavy rewrite (≈ 65% edit)</text><g class="lab"><path d="M290.0 150 L380.0 150" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="335.0" y="141" text-anchor="middle" font-size="15" font-weight="700" class="m" style="fill:#fb7185">−0.176</text></g><g class="lab"><path d="M530.0 205 L620.0 205" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="575.0" y="196" text-anchor="middle" font-size="15" font-weight="700" class="m" style="fill:#fb7185">−0.128</text></g><text x="40" y="448" font-size="13.5" class="mute">Heavy rewriting keeps 57% of the baseline score, and the ensemble is still 1.6× better than guessing.</text></svg>