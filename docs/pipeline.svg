<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Study pipeline</title>
<desc id="d">Animated pipeline: 1,196 AI passages are rewritten lightly and heavily, filtered by a dual-metric quality gate to 761, turned into 83 features, classified by a soft-voting ensemble and evaluated with 5-fold cross-validation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mute{fill:#94a3b8}
.dim{fill:#64748b}

.node{animation:lit 9s ease-in-out infinite}
@keyframes lit{0%,12%{stroke-opacity:1;fill-opacity:.34}20%,100%{stroke-opacity:.5;fill-opacity:.12}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="330" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1279" height="329" rx="22" fill="none" stroke="#2b3a5c" stroke-opacity=".8"/>
<text x="40" y="52" font-size="22" font-weight="700">How the study works</text><text x="40" y="78" font-size="15" class="mute">One text in, one question out: which of four models wrote it, and does the answer survive a rewrite?</text><rect class="node" x="34" y="112" width="176" height="120" rx="16" fill="#60a5fa" stroke="#60a5fa" stroke-width="2" fill-opacity=".12" style="animation-delay:-9.0s"/><circle cx="60" cy="140" r="14" fill="#60a5fa"/><text x="60" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">1</text><text x="84" y="145" font-size="18" font-weight="700">Collect</text><text x="52" y="184" font-size="13" class="m">1,196 passages</text><text x="52" y="206" font-size="13" class="m mute">4 LLMs × 4 domains</text><path d="M214 172.0 L238 172.0" stroke="#3b4a6b" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M232 166.0 L239 172.0 L232 178.0" stroke="#7c8db0" stroke-width="2" fill="none"/><rect class="node" x="242" y="112" width="176" height="120" rx="16" fill="#fbbf24" stroke="#fbbf24" stroke-width="2" fill-opacity=".12" style="animation-delay:-7.5s"/><circle cx="268" cy="140" r="14" fill="#fbbf24"/><text x="268" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">2</text><text x="292" y="145" font-size="18" font-weight="700">Rewrite</text><text x="260" y="184" font-size="13" class="m">light ≈ 40% edit</text><text x="260" y="206" font-size="13" class="m mute">heavy ≈ 65% edit</text><path d="M422 172.0 L446 172.0" stroke="#3b4a6b" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M440 166.0 L447 172.0 L440 178.0" stroke="#7c8db0" stroke-width="2" fill="none"/><rect class="node" x="450" y="112" width="176" height="120" rx="16" fill="#fb7185" stroke="#fb7185" stroke-width="2" fill-opacity=".12" style="animation-delay:-6.0s"/><circle cx="476" cy="140" r="14" fill="#fb7185"/><text x="476" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">3</text><text x="500" y="145" font-size="18" font-weight="700">Quality gate</text><text x="468" y="184" font-size="13" class="m">Levenshtein band</text><text x="468" y="206" font-size="13" class="m mute">+ cosine floor</text><path d="M630 172.0 L654 172.0" stroke="#3b4a6b" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M648 166.0 L655 172.0 L648 178.0" stroke="#7c8db0" stroke-width="2" fill="none"/><rect class="node" x="658" y="112" width="176" height="120" rx="16" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="2" fill-opacity=".12" style="animation-delay:-4.5s"/><circle cx="684" cy="140" r="14" fill="#2dd4bf"/><text x="684" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">4</text><text x="708" y="145" font-size="18" font-weight="700">Features</text><text x="676" y="184" font-size="13" class="m">8 stylometric</text><text x="676" y="206" font-size="13" class="m mute">+ 75 PCA semantic</text><path d="M838 172.0 L862 172.0" stroke="#3b4a6b" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M856 166.0 L863 172.0 L856 178.0" stroke="#7c8db0" stroke-width="2" fill="none"/><rect class="node" x="866" y="112" width="176" height="120" rx="16" fill="#a78bfa" stroke="#a78bfa" stroke-width="2" fill-opacity=".12" style="animation-delay:-3.0s"/><circle cx="892" cy="140" r="14" fill="#a78bfa"/><text x="892" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">5</text><text x="916" y="145" font-size="18" font-weight="700">Ensemble</text><text x="884" y="184" font-size="13" class="m">XGBoost · RF · MLP</text><text x="884" y="206" font-size="13" class="m mute">soft vote, seed 42</text><path d="M1046 172.0 L1070 172.0" stroke="#3b4a6b" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M1064 166.0 L1071 172.0 L1064 178.0" stroke="#7c8db0" stroke-width="2" fill="none"/><rect class="node" x="1074" y="112" width="176" height="120" rx="16" fill="#34d399" stroke="#34d399" stroke-width="2" fill-opacity=".12" style="animation-delay:-1.5s"/><circle cx="1100" cy="140" r="14" fill="#34d399"/><text x="1100" y="145" text-anchor="middle" font-size="15" font-weight="800" style="fill:#0b1220">6</text><text x="1124" y="145" font-size="18" font-weight="700">Evaluate</text><text x="1092" y="184" font-size="13" class="m">5-fold CV</text><text x="1092" y="206" font-size="13" class="m mute">3 conditions tested</text><circle r="6" fill="#2dd4bf" opacity=".95"><animate attributeName="cx" from="122.0" to="1162.0" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="9s" begin="0s" repeatCount="indefinite"/><set attributeName="cy" to="262"/></circle><circle r="6" fill="#2dd4bf" opacity=".95"><animate attributeName="cx" from="122.0" to="1162.0" dur="9s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="9s" begin="3s" repeatCount="indefinite"/><set attributeName="cy" to="262"/></circle><circle r="6" fill="#2dd4bf" opacity=".95"><animate attributeName="cx" from="122.0" to="1162.0" dur="9s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="9s" begin="6s" repeatCount="indefinite"/><set attributeName="cy" to="262"/></circle><line x1="122.0" y1="262" x2="1162.0" y2="262" stroke="#2b3a5c" stroke-width="2" stroke-dasharray="2 6"/><text x="40" y="308" font-size="13.5" class="mute">Only passages whose light AND heavy rewrites both clear the gate are kept: 761 of 1,196 (63.6%).</text></svg>