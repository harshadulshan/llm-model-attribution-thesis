<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Per-model recall under rewriting (fold 1)</title>
<desc id="d">Animated grouped bars: recall for ChatGPT collapses from 93% to 37%, Claude from 78% to 28%, Gemini declines from 59% to 44%, while Grok rises from 57% to 71% because heavy rewriting pulls predictions towards Grok.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mute{fill:#94a3b8}
.dim{fill:#64748b}

.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes grow{0%{transform:scaleY(0)}14%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.lab{animation:labin 10s ease-out infinite}
@keyframes labin{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="960" height="500" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="959" height="499" rx="22" fill="none" stroke="#2b3a5c" stroke-opacity=".8"/>
<text x="40" y="50" font-size="24" font-weight="700">Not every model fades the same way</text><text x="40" y="78" font-size="15" class="mute">Recall per model on the held-out fold 1 (153 passages) · bars: original → light → heavy</text><line x1="70" y1="370.0" x2="920" y2="370.0" stroke="#243049"/><text x="60" y="375.0" text-anchor="end" font-size="12.5" class="m dim">0%</text><line x1="70" y1="307.5" x2="920" y2="307.5" stroke="#243049"/><text x="60" y="312.5" text-anchor="end" font-size="12.5" class="m dim">25%</text><line x1="70" y1="245.0" x2="920" y2="245.0" stroke="#243049"/><text x="60" y="250.0" text-anchor="end" font-size="12.5" class="m dim">50%</text><line x1="70" y1="182.5" x2="920" y2="182.5" stroke="#243049"/><text x="60" y="187.5" text-anchor="end" font-size="12.5" class="m dim">75%</text><line x1="70" y1="120.0" x2="920" y2="120.0" stroke="#243049"/><text x="60" y="125.0" text-anchor="end" font-size="12.5" class="m dim">100%</text><rect class="bar" x="102.2" y="138.3" width="44" height="231.7" rx="7" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.00s"/><text class="lab m" x="124.2" y="130.3" text-anchor="middle" font-size="13" font-weight="700">93</text><rect class="bar" x="154.2" y="181.0" width="44" height="189.0" rx="7" fill="#fbbf24" fill-opacity=".92" style="animation-delay:0.00s"/><text class="lab m" x="176.2" y="173.0" text-anchor="middle" font-size="13" font-weight="700">76</text><rect class="bar" x="206.2" y="278.5" width="44" height="91.5" rx="7" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.00s"/><text class="lab m" x="228.2" y="270.5" text-anchor="middle" font-size="13" font-weight="700">37</text><text x="176.2" y="400" text-anchor="middle" font-size="17" font-weight="700" style="fill:#34d399">ChatGPT</text><rect class="bar" x="314.8" y="175.6" width="44" height="194.4" rx="7" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.08s"/><text class="lab m" x="336.8" y="167.6" text-anchor="middle" font-size="13" font-weight="700">78</text><rect class="bar" x="366.8" y="293.6" width="44" height="76.4" rx="7" fill="#fbbf24" fill-opacity=".92" style="animation-delay:0.08s"/><text class="lab m" x="388.8" y="285.6" text-anchor="middle" font-size="13" font-weight="700">31</text><rect class="bar" x="418.8" y="300.6" width="44" height="69.4" rx="7" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.08s"/><text class="lab m" x="440.8" y="292.6" text-anchor="middle" font-size="13" font-weight="700">28</text><text x="388.8" y="400" text-anchor="middle" font-size="17" font-weight="700" style="fill:#fb923c">Claude</text><rect class="bar" x="527.2" y="222.9" width="44" height="147.1" rx="7" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.16s"/><text class="lab m" x="549.2" y="214.9" text-anchor="middle" font-size="13" font-weight="700">59</text><rect class="bar" x="579.2" y="237.6" width="44" height="132.4" rx="7" fill="#fbbf24" fill-opacity=".92" style="animation-delay:0.16s"/><text class="lab m" x="601.2" y="229.6" text-anchor="middle" font-size="13" font-weight="700">53</text><rect class="bar" x="631.2" y="259.7" width="44" height="110.3" rx="7" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.16s"/><text class="lab m" x="653.2" y="251.7" text-anchor="middle" font-size="13" font-weight="700">44</text><text x="601.2" y="400" text-anchor="middle" font-size="17" font-weight="700" style="fill:#60a5fa">Gemini</text><rect class="bar" x="739.8" y="227.1" width="44" height="142.9" rx="7" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.24s"/><text class="lab m" x="761.8" y="219.1" text-anchor="middle" font-size="13" font-weight="700">57</text><rect class="bar" x="791.8" y="221.2" width="44" height="148.8" rx="7" fill="#fbbf24" fill-opacity=".92" style="animation-delay:0.24s"/><text class="lab m" x="813.8" y="213.2" text-anchor="middle" font-size="13" font-weight="700">60</text><rect class="bar" x="843.8" y="191.4" width="44" height="178.6" rx="7" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.24s"/><text class="lab m" x="865.8" y="183.4" text-anchor="middle" font-size="13" font-weight="700">71</text><text x="813.8" y="400" text-anchor="middle" font-size="17" font-weight="700" style="fill:#a78bfa">Grok</text><rect x="40" y="434" width="14" height="14" rx="4" fill="#2dd4bf"/><text x="62" y="446" font-size="14" class="mute">original</text><rect x="190" y="434" width="14" height="14" rx="4" fill="#fbbf24"/><text x="212" y="446" font-size="14" class="mute">light rewrite</text><rect x="340" y="434" width="14" height="14" rx="4" fill="#fb7185"/><text x="362" y="446" font-size="14" class="mute">heavy rewrite</text><text x="40" y="476" font-size="13.5" class="mute">ChatGPT recall falls 93% → 37%. Grok recall rises, but only because predictions pile onto Grok: its precision drops 65% → 45%.</text></svg>