<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Extension: human vs AI vs AI-paraphrased</title>
<desc id="d">Animated results of the exploratory three-class classifier: macro F1 0.693 for the full ensemble against a chance level of 0.333, and the fold 1 confusion matrix.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mute{fill:#94a3b8}
.dim{fill:#64748b}

.hb{transform-box:fill-box;transform-origin:0% 50%;animation:growx 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes growx{0%{transform:scaleX(0)}14%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.lab{animation:labin 10s ease-out infinite}
@keyframes labin{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
.cell{animation:cellin 10s ease-out infinite}
@keyframes cellin{0%,8%{opacity:0}20%,92%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="960" height="500" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="959" height="499" rx="22" fill="none" stroke="#2b3a5c" stroke-opacity=".8"/>
<text x="40" y="50" font-size="24" font-weight="700">Can it tell human, AI and AI-paraphrased apart?</text><text x="40" y="78" font-size="15" class="mute">Exploratory three-class model · 1,620 passages (360 human + 630 + 630) · 5-fold CV</text><line x1="312.5" y1="122" x2="312.5" y2="352" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="312.5" y="116" text-anchor="middle" font-size="12.5" class="m mute">chance 0.333</text><text x="188" y="162" text-anchor="end" font-size="14.5" font-weight="600">Stylometric only</text><rect x="200" y="142" width="270" height="28" rx="14" fill="#17213a"/><rect class="hb" x="200" y="142" width="213.9" height="28" rx="14" fill="#60a5fa" fill-opacity=".92" style="animation-delay:0.00s"/><text class="lab m" x="423.9" y="162" font-size="15" font-weight="800">0.634</text><text x="188" y="218" text-anchor="end" font-size="14.5" font-weight="600">Semantic only</text><rect x="200" y="198" width="270" height="28" rx="14" fill="#17213a"/><rect class="hb" x="200" y="198" width="188.2" height="28" rx="14" fill="#60a5fa" fill-opacity=".92" style="animation-delay:0.08s"/><text class="lab m" x="398.2" y="218" font-size="15" font-weight="800">0.558</text><text x="188" y="274" text-anchor="end" font-size="14.5" font-weight="600">Combined (XGBoost)</text><rect x="200" y="254" width="270" height="28" rx="14" fill="#17213a"/><rect class="hb" x="200" y="254" width="221.7" height="28" rx="14" fill="#60a5fa" fill-opacity=".92" style="animation-delay:0.16s"/><text class="lab m" x="431.7" y="274" font-size="15" font-weight="800">0.657</text><text x="188" y="330" text-anchor="end" font-size="14.5" font-weight="600">Soft-voting ensemble</text><rect x="200" y="310" width="270" height="28" rx="14" fill="#17213a"/><rect class="hb" x="200" y="310" width="234.0" height="28" rx="14" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.24s"/><text class="lab m" x="444.0" y="330" font-size="15" font-weight="800">0.693</text><text x="735.0" y="110" text-anchor="middle" font-size="14" font-weight="700">Fold 1 confusion matrix (324 passages)</text><text x="735.0" y="132" text-anchor="middle" font-size="12.5" class="mute">predicted class →</text><text x="635.0" y="154" text-anchor="middle" font-size="12.5" class="m mute">AI-orig.</text><text x="735.0" y="154" text-anchor="middle" font-size="12.5" class="m mute">AI-para.</text><text x="835.0" y="154" text-anchor="middle" font-size="12.5" class="m mute">Human</text><text x="575" y="208.0" text-anchor="end" font-size="12.5" class="m mute">AI-orig.</text><g class="cell" style="animation-delay:0.00s"><rect x="588" y="167" width="94" height="74" rx="10" fill="#2dd4bf" fill-opacity="0.63"/><text x="635.0" y="213.0" text-anchor="middle" font-size="26" font-weight="800" class="m">78</text></g><g class="cell" style="animation-delay:0.05s"><rect x="688" y="167" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.41"/><text x="735.0" y="213.0" text-anchor="middle" font-size="26" font-weight="800" class="m">45</text></g><g class="cell" style="animation-delay:0.10s"><rect x="788" y="167" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.14"/><text x="835.0" y="213.0" text-anchor="middle" font-size="26" font-weight="800" class="m">3</text></g><text x="575" y="288.0" text-anchor="end" font-size="12.5" class="m mute">AI-para.</text><g class="cell" style="animation-delay:0.15s"><rect x="588" y="247" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.39"/><text x="635.0" y="293.0" text-anchor="middle" font-size="26" font-weight="800" class="m">42</text></g><g class="cell" style="animation-delay:0.20s"><rect x="688" y="247" width="94" height="74" rx="10" fill="#2dd4bf" fill-opacity="0.66"/><text x="735.0" y="293.0" text-anchor="middle" font-size="26" font-weight="800" class="m">83</text></g><g class="cell" style="animation-delay:0.25s"><rect x="788" y="247" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.13"/><text x="835.0" y="293.0" text-anchor="middle" font-size="26" font-weight="800" class="m">1</text></g><text x="575" y="368.0" text-anchor="end" font-size="12.5" class="m mute">Human</text><g class="cell" style="animation-delay:0.30s"><rect x="588" y="327" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.20"/><text x="635.0" y="373.0" text-anchor="middle" font-size="26" font-weight="800" class="m">7</text></g><g class="cell" style="animation-delay:0.35s"><rect x="688" y="327" width="94" height="74" rx="10" fill="#fb7185" fill-opacity="0.17"/><text x="735.0" y="373.0" text-anchor="middle" font-size="26" font-weight="800" class="m">4</text></g><g class="cell" style="animation-delay:0.40s"><rect x="788" y="327" width="94" height="74" rx="10" fill="#2dd4bf" fill-opacity="0.81"/><text x="835.0" y="373.0" text-anchor="middle" font-size="26" font-weight="800" class="m">61</text></g><text x="735.0" y="428" text-anchor="middle" font-size="13.5" class="mute">61 of 72 human passages found (85%)</text><text x="735.0" y="448" text-anchor="middle" font-size="13.5" class="mute">1 of 126 paraphrased passages called human</text><text x="40" y="476" font-size="13.5" class="mute">The two AI classes blur into each other. Human text differs in era and genre, so treat this as a demonstration, not a detector.</text></svg>