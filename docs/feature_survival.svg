<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Which stylometric features survive rewriting?</title>
<desc id="d">Animated horizontal bars of the share of SHAP importance each feature keeps after heavy rewriting. Comma density keeps 124 percent, type-token ratio only 77 percent.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111c33"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mute{fill:#94a3b8}
.dim{fill:#64748b}

.hb{transform-box:fill-box;transform-origin:0% 50%;animation:growx 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes growx{0%{transform:scaleX(0)}14%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.lab{animation:labin 10s ease-out infinite}
@keyframes labin{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="960" height="560" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="959" height="559" rx="22" fill="none" stroke="#2b3a5c" stroke-opacity=".8"/>
<text x="40" y="50" font-size="24" font-weight="700">The strongest stylometric feature is the most fragile</text><text x="40" y="78" font-size="15" class="mute">Share of baseline SHAP importance kept after heavy rewriting (100% = unchanged) · XGBoost member, fold 1</text><line x1="585.7" y1="104" x2="585.7" y2="452" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="585.7" y="98" text-anchor="middle" font-size="12.5" class="m mute">100% = same importance</text><text x="920" y="98" text-anchor="end" font-size="12.5" class="m dim">baseline importance</text><text x="286" y="137" text-anchor="end" font-size="15.5" font-weight="600">comma density</text><rect x="300" y="120" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="120" width="353.2" height="24" rx="12" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.00s"/><text class="lab m" x="663.2" y="138" font-size="14" font-weight="700">124%</text><text x="920" y="138" text-anchor="end" font-size="13" class="m mute">0.103 · rank 5 of 8</text><text x="286" y="175" text-anchor="end" font-size="15.5" font-weight="600">hedging frequency</text><rect x="300" y="158" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="158" width="339.1" height="24" rx="12" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.07s"/><text class="lab m" x="649.1" y="176" font-size="14" font-weight="700">119%</text><text x="920" y="176" text-anchor="end" font-size="13" class="m mute">0.010 · rank 8 of 8</text><text x="286" y="213" text-anchor="end" font-size="15.5" font-weight="600">Flesch-Kincaid grade</text><rect x="300" y="196" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="196" width="332.7" height="24" rx="12" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.14s"/><text class="lab m" x="642.7" y="214" font-size="14" font-weight="700">116%</text><text x="920" y="214" text-anchor="end" font-size="13" class="m mute">0.026 · rank 6 of 8</text><text x="286" y="251" text-anchor="end" font-size="15.5" font-weight="600">mean sentence length</text><rect x="300" y="234" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="234" width="324.0" height="24" rx="12" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.21s"/><text class="lab m" x="634.0" y="252" font-size="14" font-weight="700">113%</text><text x="920" y="252" text-anchor="end" font-size="13" class="m mute">0.503 · rank 3 of 8</text><text x="286" y="289" text-anchor="end" font-size="15.5" font-weight="600">passive voice rate</text><rect x="300" y="272" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="272" width="314.3" height="24" rx="12" fill="#2dd4bf" fill-opacity=".92" style="animation-delay:0.28s"/><text class="lab m" x="624.3" y="290" font-size="14" font-weight="700">110%</text><text x="920" y="290" text-anchor="end" font-size="13" class="m mute">0.017 · rank 7 of 8</text><text x="286" y="327" text-anchor="end" font-size="15.5" font-weight="600">mean word length</text><rect x="300" y="310" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="310" width="265.4" height="24" rx="12" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.35s"/><text class="lab m" x="575.4" y="328" font-size="14" font-weight="700">93%</text><text x="920" y="328" text-anchor="end" font-size="13" class="m mute">0.409 · rank 4 of 8</text><text x="286" y="365" text-anchor="end" font-size="15.5" font-weight="600">sentence length variance</text><rect x="300" y="348" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="348" width="249.5" height="24" rx="12" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.42s"/><text class="lab m" x="559.5" y="366" font-size="14" font-weight="700">87%</text><text x="920" y="366" text-anchor="end" font-size="13" class="m mute">0.560 · rank 2 of 8</text><text x="286" y="403" text-anchor="end" font-size="15.5" font-weight="600">type-token ratio</text><rect x="300" y="386" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="386" width="221.0" height="24" rx="12" fill="#fb7185" fill-opacity=".92" style="animation-delay:0.49s"/><text class="lab m" x="531.0" y="404" font-size="14" font-weight="700">77%</text><text x="920" y="404" text-anchor="end" font-size="13" class="m mute">1.261 · rank 1 of 8</text><text x="286" y="441" text-anchor="end" font-size="15.5" font-weight="600">semantic block (75 PCA)</text><rect x="300" y="424" width="400" height="24" rx="12" fill="#17213a"/><rect class="hb" x="300" y="424" width="295.4" height="24" rx="12" fill="#a78bfa" fill-opacity=".92" style="animation-delay:0.56s"/><text class="lab m" x="605.4" y="442" font-size="14" font-weight="700">103%</text><text x="920" y="442" text-anchor="end" font-size="13" class="m mute">2.006 · all 75 comps.</text><text x="40" y="536" font-size="13.5" class="mute">Type-token ratio carries the most signal (mean |SHAP| 1.26) but keeps only 77%. Comma density starts 5th of 8 and holds up best.</text></svg>